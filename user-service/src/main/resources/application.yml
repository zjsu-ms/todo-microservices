server:
  port: 8081

spring:
  application:
    name: user-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: DEFAULT_GROUP

  datasource:
    url: jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4&useUnicode=true
    username: user_user
    password: user_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# JWT配置
jwt:
  secret: your-256-bit-secret-key-here-must-be-long-enough-for-HS512-algorithm
  expiration: 86400000  # 24小时(毫秒)

# Actuator配置 - 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: '*'  # 暴露所有端点
  metrics:
    export:
      prometheus:
        enabled: true  # 启用Prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always  # 显示健康检查详情

# 分布式链路追踪配置
management.tracing:
  sampling:
    probability: 1.0  # 采样率100%(开发环境)

management.zipkin.tracing:
  endpoint: http://localhost:9411/api/v2/spans  # Zipkin服务器地址

logging:
  level:
    com.zjgsu.user: INFO
    org.springframework.web: INFO
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'  # 日志中包含TraceId和SpanId
