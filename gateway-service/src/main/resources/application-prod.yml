server:
  port: 8080

spring:
  application:
    name: gateway-service

  # 🔑 配置导入 - Spring Cloud 2025.0.0
  config:
    import:
      - optional:nacos:gateway-service-prod.yaml?group=DEFAULT_GROUP&refresh=true

  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      # Nacos 服务器地址
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      namespace: ${NACOS_NAMESPACE:dev}

      # 配置中心设置
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true

      # 服务发现设置
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP

    gateway:
      # 路由配置
      routes:
        # 用户服务路由
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/auth/**

        # Todo服务路由
        - id: todo-service-route
          uri: lb://todo-service
          predicates:
            - Path=/api/todos/**

      # 跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-long-enough-for-HS512-algorithm}
  expiration: 86400000  # 24小时(毫秒)

logging:
  level:
    com.zjgsu.gateway: INFO
    org.springframework.cloud.gateway: INFO
    com.alibaba.nacos: INFO
    org.springframework.cloud.context: DEBUG

# Actuator 配置 - 启用配置刷新端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env,gateway
  endpoint:
    health:
      show-details: always
    refresh:
      enabled: true
