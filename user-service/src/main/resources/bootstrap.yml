spring:
  application:
    name: user-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        refresh-enabled: true
        enabled: true

        # ========== 共享配置示例 ==========
        # 共享配置用于多个服务共同使用的配置（如数据库、Redis等）
        # 使用方法：
        # 1. 在 Nacos 控制台创建共享配置文件（如 common-mysql.yaml）
        # 2. 取消下面的注释即可启用
        #
        # shared-configs:
        #   - data-id: common-mysql.yaml
        #     group: COMMON_GROUP
        #     refresh: true
        #   - data-id: common-redis.yaml
        #     group: COMMON_GROUP
        #     refresh: true
        #
        # extension-configs:
        #   - data-id: log-config.yaml
        #     group: DEFAULT_GROUP
        #     refresh: true
        # ========================================

      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    publisher-confirm-type: correlated  # 开启发送确认
    publisher-returns: true             # 开启发送失败退回
    listener:
      simple:
        acknowledge-mode: manual        # 手动确认
        retry:
          enabled: true
          max-attempts: 3               # 最多重试3次
          initial-interval: 2000        # 初始间隔2秒
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Actuator健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always
